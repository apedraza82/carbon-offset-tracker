name: Monthly Carbon Offset Update

on:
  # Cron disabled 2026-05-07: pipeline only handles Berkeley VROD's 4 registries
  # (Verra/Gold/ACR/CAR) and clobbers the manually-added EcoRegistry/BioCarbon/
  # Puro/CDM data plus prior LLM matches on each run. Re-enable only after the
  # pipeline can incorporate all 8 registries and preserve LLM-matched rows.
  # schedule:
  #   - cron: '0 6 5 * *'
  workflow_dispatch:  # Manual trigger only

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download and process new retirements
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m src.pipeline

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ docs/data/
          git diff --cached --quiet || git commit -m "Update matched retirements $(date +%Y-%m-%d)"
          git push

      - name: Create release with data files
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: data-${{ github.run_number }}
          name: "Data Update $(date +%Y-%m-%d)"
          files: |
            data/matched_retirements.csv
            data/summary_stats.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
